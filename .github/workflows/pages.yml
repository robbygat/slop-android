name: Publish public Android download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and verify the public APK
        run: |
          mkdir site
          curl --fail --location --retry 3 --output site/Slop-3.7.7-build-2070-universal.apk https://github.com/robbygat/slop-web/releases/download/android-3.7.7-build-2070/Slop-3.7.7-build-2070-universal.apk
          echo '7b7124edef410fd173257e82cf3e66f53cdf1f7597646b3c7f89b3e687d55439  site/Slop-3.7.7-build-2070-universal.apk' | sha256sum --check
          cp README.md site/index.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
